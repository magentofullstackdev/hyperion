# SPDX-License-Identifier: MIT
name: PHP

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * *'

jobs:
  legs:
    name: Select the matrix legs
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        # A job-level `if` cannot read `matrix`, so the legs are chosen here.
        # gate: the two blocking legs, the platform the release is verified on (docs/compatibility.md).
        # php-8.3, tier-2: non-blocking legs for the oldest supported PHP and the previous Mage-OS line.
        # canary: the newest Mage-OS release, whatever it is; non-blocking, scheduled runs only.
        env:
          SCHEDULED: ${{ github.event_name == 'schedule' }}
        run: |
          set -euo pipefail
          legs='[
            {"label": "gate",    "mageos": "4.0.*", "php": "8.4", "mariadb": "mariadb:12.3", "opensearch": "opensearchproject/opensearch:3"},
            {"label": "gate",    "mageos": "4.0.*", "php": "8.5", "mariadb": "mariadb:12.3", "opensearch": "opensearchproject/opensearch:3"},
            {"label": "php-8.3", "mageos": "4.0.*", "php": "8.3", "mariadb": "mariadb:12.3", "opensearch": "opensearchproject/opensearch:3", "experimental": true},
            {"label": "tier-2",  "mageos": "3.6.*", "php": "8.4", "mariadb": "mariadb:12.3", "opensearch": "opensearchproject/opensearch:3", "experimental": true},
            {"label": "canary",  "mageos": "*",     "php": "8.5", "mariadb": "mariadb:12.3", "opensearch": "opensearchproject/opensearch:3", "experimental": true, "nightly": true}
          ]'
          if [ "$SCHEDULED" = "true" ]; then
            include=$(jq -c . <<<"$legs")
          else
            include=$(jq -c 'map(select(.nightly != true))' <<<"$legs")
          fi
          echo "matrix={\"include\":$include}" >> "$GITHUB_OUTPUT"

  php:
    name: ${{ matrix.label }} / Mage-OS ${{ matrix.mageos }} / PHP ${{ matrix.php }}
    needs: legs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.legs.outputs.matrix) }}
    continue-on-error: ${{ matrix.experimental == true }}
    services:
      mysql:
        image: ${{ matrix.mariadb }}
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: magento
        ports: ['3306:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=10
      opensearch:
        image: ${{ matrix.opensearch }}
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: 'true'
          DISABLE_INSTALL_DEMO_CONFIG: 'true'
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports: ['9200:9200']
    steps:
      - uses: actions/checkout@v5
        with:
          path: hyperion
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, gd, intl, mbstring, pdo_mysql, soap, sockets, sodium, xsl, zip
          tools: composer:v2
          coverage: none
      - name: composer validate (the twelve manifests)
        if: matrix.label == 'gate'
        # Non-strict on purpose: the `version` field and the unbound `*` constraints on
        # `magento/module-*` are intentional and only raise warnings.
        run: |
          set -euo pipefail
          manifests=(hyperion/app/code/Magentofullstackdev/*/composer.json hyperion/app/design/frontend/Magentofullstackdev/*/composer.json)
          test "${#manifests[@]}" -eq 12
          for manifest in "${manifests[@]}"; do
            composer validate --no-interaction "$manifest"
          done
      - name: Versions agree (Composer manifests and npm packages)
        if: matrix.label == 'gate'
        run: |
          set -euo pipefail
          files=(hyperion/app/code/Magentofullstackdev/*/composer.json hyperion/app/design/frontend/Magentofullstackdev/*/composer.json hyperion/frontend/packages/*/package.json)
          test "${#files[@]}" -eq 15
          versions=$(jq -r .version "${files[@]}" | sort -u)
          echo "$versions"
          test "$(wc -l <<<"$versions")" -eq 1
          test "$versions" != "null"
      - name: Locate the Composer cache
        id: composer-cache
        run: echo "dir=$(composer config --global cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.label }}-php${{ matrix.php }}-mageos${{ matrix.mageos }}
          restore-keys: |
            composer-${{ matrix.label }}-php${{ matrix.php }}-
      - name: Create a Mage-OS project (no authentication keys needed)
        # The gate legs pin the Mage-OS minor the release is verified on (docs/compatibility.md);
        # the scheduled canary leg tracks the newest release without blocking the gate.
        run: composer create-project --repository-url=https://repo.mage-os.org/ "mage-os/project-community-edition:${{ matrix.mageos }}" magento --no-interaction --no-progress
      - name: Install Hyperion from this checkout (copy, like a Packagist install)
        working-directory: magento
        run: |
          composer config repositories.hyperion-modules '{"type":"path","url":"../hyperion/app/code/Magentofullstackdev/*","options":{"symlink":false}}'
          composer config repositories.hyperion-theme '{"type":"path","url":"../hyperion/app/design/frontend/Magentofullstackdev/*","options":{"symlink":false}}'
          composer config minimum-stability beta
          composer config prefer-stable true
          composer require "magentofullstackdev/theme-hyperion:*" "magentofullstackdev/module-hyperion-sample-data:*" --no-interaction --no-progress
      - name: Install Magento and compile
        working-directory: magento
        run: |
          bin/magento setup:install --base-url=http://ci.local/ --db-host=127.0.0.1 --db-name=magento --db-user=root --db-password=root \
            --admin-firstname=CI --admin-lastname=CI --admin-email=ci@example.com --admin-user=ci --admin-password=CiPassword123 \
            --search-engine=opensearch --opensearch-host=127.0.0.1 --opensearch-port=9200 --no-interaction
          bin/magento setup:di:compile
      - name: Plugin targets exist
        working-directory: magento
        # A plugin method on a type that has no such public method compiles and never runs.
        run: php ../hyperion/.github/scripts/check-plugin-targets.php "$PWD" "$PWD/../hyperion"
      - name: phpcs (Magento2 standard, errors only)
        working-directory: magento
        # Deprecation notices raised inside legacy sniffs on PHP 8.4 must not fail the gate.
        run: php -d error_reporting="E_ALL&~E_DEPRECATED" vendor/bin/phpcs --standard=Magento2 --extensions=php,phtml -n --report=summary ../hyperion/app/code/Magentofullstackdev ../hyperion/app/design/frontend/Magentofullstackdev
      - name: phpstan level 5
        working-directory: magento
        run: vendor/bin/phpstan analyse --level=5 --no-progress --error-format=github ../hyperion/app/code/Magentofullstackdev
      - name: phpunit
        working-directory: magento
        run: |
          set -euo pipefail
          # Every module that ships a Test directory; a new module joins without a workflow change.
          # --no-extensions: core's phpunit.xml.dist bootstraps the Allure extension with a config path
          # relative to the cwd; from the Magento root every test passes and the runner still exits 1.
          found=0
          for t in ../hyperion/app/code/Magentofullstackdev/*/Test; do
            [ -d "$t" ] || continue
            found=$((found + 1))
            echo "::group::$t"
            vendor/bin/phpunit --no-extensions --do-not-cache-result -c dev/tests/unit/phpunit.xml.dist "$t"
            echo "::endgroup::"
          done
          test "$found" -gt 0
