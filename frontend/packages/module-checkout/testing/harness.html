<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>Hyperion checkout extension harness</title>
        <!--
            Static page that mounts one extension element with a mock context:
            harness.html?module=<same-origin module URL>&tag=<custom element tag>&type=payment|shipping|slot|express
            The module must define the tag. Every event of the element and every
            call it makes on its context is written to the log.
        -->
        <style>
            :root { font-family: system-ui, sans-serif; color: #1f2937; }
            body { margin: 0; display: grid; grid-template-columns: minmax(16rem, 22rem) 1fr; min-height: 100vh; }
            aside { padding: 1rem; background: #f3f4f6; border-right: 1px solid #d1d5db; overflow-y: auto; }
            main { padding: 1rem; display: grid; grid-template-rows: auto 1fr; gap: 1rem; min-width: 0; }
            fieldset { border: 1px solid #d1d5db; margin: 0 0 1rem; padding: 0.5rem 0.75rem; }
            legend { font-weight: 600; }
            label { display: grid; gap: 0.125rem; margin: 0.375rem 0; font-size: 0.875rem; }
            label.inline { display: flex; align-items: center; gap: 0.5rem; }
            input, select, textarea, button { font: inherit; }
            textarea { min-height: 4rem; font-family: ui-monospace, monospace; font-size: 0.8125rem; }
            button { margin: 0.25rem 0.25rem 0 0; padding: 0.25rem 0.75rem; }
            #hyperion-harness-stage { display: block; border: 1px dashed #9ca3af; padding: 1rem; min-height: 6rem; }
            #hyperion-harness-log { margin: 0; padding: 0.5rem; background: #111827; color: #e5e7eb; overflow: auto;
                font-family: ui-monospace, monospace; font-size: 0.8125rem; list-style: none; }
            #hyperion-harness-log li { white-space: pre-wrap; border-bottom: 1px solid #374151; padding: 0.25rem 0; }
            #hyperion-harness-log li[data-tone="error"] { color: #fca5a5; }
            #hyperion-harness-status { margin: 0 0 0.5rem; font-size: 0.875rem; }
        </style>
    </head>
    <body>
        <aside>
            <p id="hyperion-harness-status">Loading</p>
            <form id="hyperion-harness-panel">
                <fieldset>
                    <legend>Shopper</legend>
                    <label class="inline"><input type="checkbox" name="customer"/> Signed in customer</label>
                    <label>Email <input name="email" type="email" value="shopper@example.com"/></label>
                </fieldset>
                <fieldset>
                    <legend>Totals</legend>
                    <label>Grand total (display) <input name="grandTotal" type="number" step="0.01" value="57"/></label>
                    <label>Grand total (base) <input name="baseGrandTotal" type="number" step="0.01" value="57"/></label>
                    <label>Display currency <input name="displayCurrency" value="USD" maxlength="3"/></label>
                    <label>Base currency <input name="baseCurrency" value="USD" maxlength="3"/></label>
                </fieldset>
                <fieldset>
                    <legend>Shipping address</legend>
                    <label>Country <input name="country" value="US" maxlength="2"/></label>
                    <label>Postcode <input name="postcode" value="49628-7978"/></label>
                    <label>City <input name="city" value="Calder"/></label>
                </fieldset>
                <fieldset>
                    <legend>Shipping method</legend>
                    <label>Selected
                        <select name="shippingMethod">
                            <option value="flatrate_flatrate">Flat Rate (5.00)</option>
                            <option value="tablerate_bestway">Best Way (10.00)</option>
                            <option value="freeshipping_freeshipping">Free Shipping (0.00)</option>
                            <option value="">None</option>
                        </select>
                    </label>
                </fieldset>
                <button type="submit">Apply snapshot</button>
                <fieldset>
                    <legend>Element</legend>
                    <label>options (JSON) <textarea name="options">{}</textarea></label>
                    <label>config (JSON, payment) <textarea name="config">{}</textarea></label>
                    <label>value (JSON, shipping) <textarea name="value">null</textarea></label>
                    <button type="button" data-action="remount">Remount</button>
                    <button type="button" data-action="reconnect">Disconnect and reconnect</button>
                    <button type="button" data-action="validate">validate()</button>
                    <button type="button" data-action="payment-data">getPaymentData()</button>
                    <button type="button" data-action="clear">Clear log</button>
                </fieldset>
            </form>
        </aside>
        <main>
            <checkout-app id="hyperion-harness-stage"></checkout-app>
            <ol id="hyperion-harness-log" aria-live="polite"></ol>
        </main>
        <script type="module" src="./harness.js"></script>
    </body>
</html>
